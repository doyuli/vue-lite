<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleport</title>
</head>

<body>
  <div id="app"></div>
  <div id="to-container"></div>
  <script type="module">
    import { h, ref, createApp, Teleport } from '../dist/vue.esm.js';

    const App = {
      setup() {
        const list = ref([1, 2, 3])

        const to = ref('body')
        const disabled = ref(true)

        setTimeout(() => {
          // list.value.push(4)
          // to.value = '#to-container'
          disabled.value = false
        }, 3000);

        return () => {
          return h('div', h(Teleport, { to: to.value, disabled: disabled.value }, [...list.value.map(v => h('div', v)), h(Child)]))
        }
      },
    }

    const Child = {
      setup() {
        return () => {
          return h('div', [h('p', '我是子组件'),])
        }
      },
    }

    const app = createApp(App)
    app.mount('#app')
  </script>
</body>

</html>
