<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Fragment</title>
</head>

<body>
  <div id="app"></div>
  <script type="module">
    import { h, ref, createApp, Fragment } from '../dist/vue.esm.js';

    const App = {
      name: 'App',
      setup() {
        const count = ref(0)

        setTimeout(() => {
          count.value++
        }, 1000);
        return () => {
          return h(Fragment, [
            h('div', `Hello World ${count.value}`),
            h('div', 'Vite Lite'),
          ])
        }
      },
    }

    const app = createApp(App)
    app.mount('#app')

    setTimeout(() => {
      app.unmount()
    }, 2000);
  </script>
</body>

</html>
