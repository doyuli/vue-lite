<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组件的实例</title>
</head>

<body>
  <div id="app"></div>
  <script type="module">
    import { h, createApp, getCurrentInstance } from '../dist/vue.esm.js';
    // import { h, createApp, getCurrentInstance } from '../../../node_modules/vue/dist/vue.esm-browser.js';

    const Comp = {
      setup() {
        const vm = getCurrentInstance()
        console.log("🚀 ~ setup ~ vm:", vm.proxy.$nextTick)

        return () => {
          return h('div', [h('p', '我是父组件')])
        }
      },
    }

    createApp(Comp).mount('#app')
  </script>
</body>

</html>
